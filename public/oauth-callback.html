<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Focused · Signing in…</title>
    <style>body{font:14px system-ui,sans-serif;background:#121212;color:#ddd;display:grid;place-items:center;height:100vh;margin:0}</style>
  </head>
  <body>
    <p id="msg">Signing in… this window closes by itself.</p>
    <script>
      // Hands the OAuth result back to the Focused tab (see src/core/export/drive.ts).
      var p = new URLSearchParams(location.hash.slice(1) || location.search.slice(1));
      var ch = new BroadcastChannel("focused-oauth");
      ch.postMessage({ state: p.get("state"), token: p.get("access_token"), expiresIn: Number(p.get("expires_in") || 3600), error: p.get("error") });
      ch.close();
      history.replaceState(null, "", location.pathname);
      setTimeout(function () { window.close(); document.getElementById("msg").textContent = "Signed in. You can close this window."; }, 150);
    </script>
  </body>
</html>
