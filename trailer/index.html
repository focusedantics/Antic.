<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Focused trailer</title>
    <style>
      html, body { margin: 0; height: 100%; background: #050505; color: #ddd; font: 13px Inter, system-ui, sans-serif; }
      body { display: grid; place-items: center; gap: 10px; grid-template-rows: 1fr auto; }
      canvas { max-width: 100vw; max-height: calc(100vh - 44px); background: #000; }
      .bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; }
      .bar input[type="range"] { width: min(60vw, 640px); }
      button { background: #222; color: #eee; border: 1px solid #333; border-radius: 6px; padding: 4px 10px; }
      body[data-render] .bar { display: none; }
      body[data-render] { display: block; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="bar">
      <button id="play" type="button">Play</button>
      <input id="seek" type="range" min="0" max="60" step="0.0333" value="0" aria-label="Time" />
      <span id="time">0.00 s</span>
      <span id="note"></span>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
